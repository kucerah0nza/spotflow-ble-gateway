name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Mosquitto backs the session/OTA tests (a local broker per test).
      - name: Install Mosquitto (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mosquitto
      - name: Install Mosquitto (macOS)
        if: runner.os == 'macOS'
        run: brew install mosquitto
      # Not on Chocolatey; use the official installer (NSIS, silent with /S).
      - name: Install Mosquitto (Windows)
        if: runner.os == 'Windows'
        env:
          MOSQUITTO_VERSION: "2.1.4"
          # SHA-256 of the installer; update together with the version.
          MOSQUITTO_SHA256: "034017c8f8e3b5b86bdbd971f6c5184370311058e4de7b96a0f10204bbb9e7c8"
        run: |
          $installer = "$env:RUNNER_TEMP\mosquitto-install.exe"
          Invoke-WebRequest "https://mosquitto.org/files/binary/win64/mosquitto-$env:MOSQUITTO_VERSION-install-windows-x64.exe" -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne $env:MOSQUITTO_SHA256) { throw "Mosquitto installer checksum mismatch: $hash" }
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          "C:\Program Files\mosquitto" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Show Mosquitto version
        shell: bash
        run: (mosquitto -h || true) | head -2

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: CLI smoke test
        run: python -m spotflow_gateway --help

      - name: Run tests
        env:
          REQUIRE_MOSQUITTO: "1"
        run: python -m pytest -v
