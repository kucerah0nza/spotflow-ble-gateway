[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spotflow-ble-gateway"
version = "0.1.0"
description = "Gateway bridging Spotflow BLE devices to the Spotflow cloud over MQTT"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Spotflow" }]
requires-python = ">=3.11"
dependencies = [
    "bleak>=1.0",
    "paho-mqtt>=2.0",
    "certifi",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "trustme>=1.1", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
spotflow-gateway = "spotflow_gateway.__main__:main"

[tool.setuptools]
packages = ["spotflow_gateway"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
files = ["spotflow_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
